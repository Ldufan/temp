<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1628">
    <title>BLE 温湿度监测 (全广播调试)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a1628; color: #e8edf5;
            min-height: 100vh; display: flex; justify-content: center;
            padding: 16px 12px 30px;
        }
        #app { max-width: 480px; width: 100%; }
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding: 0 4px;
        }
        .app-title {
            font-size: 20px; font-weight: 600;
            background: linear-gradient(135deg, #60b0ff, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status-badge {
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; color: #94a3b8;
            background: rgba(255,255,255,0.06);
            padding: 6px 14px 6px 12px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #475569; transition: background 0.3s;
        }
        .status-dot.scanning {
            background: #22d3ee;
            box-shadow: 0 0 12px rgba(34,211,238,0.6);
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.6; }
        }
        .record-count { font-weight: 500; color: #e8edf5; min-width: 20px; text-align: center; }

        .config-row {
            display: flex; gap: 8px; align-items: center;
            background: rgba(255,255,255,0.04);
            padding: 8px 12px; border-radius: 16px; margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap;
        }
        .config-row label {
            font-size: 13px; color: #94a3b8; white-space: nowrap; min-width: 60px;
        }
        .config-row input {
            flex: 1; min-width: 150px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 8px 12px;
            color: #e8edf5; font-size: 13px; font-family: monospace;
            outline: none; transition: border-color 0.2s;
        }
        .config-row input:focus { border-color: #60b0ff; }
        .config-row .hint {
            font-size: 11px; color: #64748b; width: 100%; margin-top: 2px;
        }
        .config-row .checkbox-wrap {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; color: #94a3b8;
        }
        .config-row .checkbox-wrap input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: #60b0ff;
            background: rgba(0,0,0,0.3); border-radius: 4px;
        }

        .main-card {
            background: linear-gradient(145deg, #111d35, #0e172a);
            border-radius: 28px; padding: 28px 22px 22px; margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .main-card .temp-wrap {
            display: flex; align-items: baseline; justify-content: center; gap: 4px;
            margin-bottom: 6px; position: relative; z-index: 1;
        }
        .main-card .temp-value {
            font-size: 72px; font-weight: 300; letter-spacing: -2px; line-height: 1.1;
            color: #ffffff; transition: color 0.4s;
        }
        .main-card .temp-value.cold { color: #7dd3fc; }
        .main-card .temp-value.mild { color: #fcd34d; }
        .main-card .temp-value.hot { color: #fca5a5; }
        .main-card .temp-unit { font-size: 28px; font-weight: 400; color: #94a3b8; margin-left: 2px; }
        .main-card .temp-label {
            text-align: center; font-size: 14px; color: #64748b;
            letter-spacing: 2px; text-transform: uppercase; margin-top: -2px; margin-bottom: 18px;
            position: relative; z-index: 1;
        }
        .metrics {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            margin-top: 6px; position: relative; z-index: 1;
        }
        .metric-item {
            background: rgba(255,255,255,0.04); border-radius: 16px; padding: 12px 6px;
            text-align: center; border: 1px solid rgba(255,255,255,0.04);
        }
        .metric-item .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
        .metric-item .value { font-size: 20px; font-weight: 500; color: #e8edf5; }
        .metric-item .value .sub { font-size: 13px; font-weight: 400; color: #94a3b8; margin-left: 2px; }
        .metric-item .value.rssi-val { color: #94a3b8; }
        .metric-item.battery .value { color: #4ade80; }
        .metric-item.humidity .value { color: #60b0ff; }
        .no-data { text-align: center; padding: 20px 0 8px; color: #475569; font-size: 14px; }
        .no-data .icon { font-size: 32px; margin-bottom: 6px; opacity: 0.5; }

        .history-section {
            background: rgba(255,255,255,0.03); border-radius: 20px;
            padding: 16px 0 4px; border: 1px solid rgba(255,255,255,0.04); margin-bottom: 14px;
        }
        .history-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 18px 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .history-header h3 { font-size: 15px; font-weight: 500; color: #c8d0dc; letter-spacing: 0.3px; }
        .history-header .clear-btn {
            background: none; border: none; color: #64748b; font-size: 13px;
            cursor: pointer; padding: 4px 10px; border-radius: 8px;
            transition: background 0.2s, color 0.2s;
        }
        .history-header .clear-btn:hover { background: rgba(248,113,113,0.12); color: #f87171; }
        .history-list {
            max-height: 200px; overflow-y: auto; padding: 4px 6px 6px;
        }
        .history-list::-webkit-scrollbar { width: 3px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .history-item {
            display: grid; grid-template-columns: 80px 1fr 1fr 1fr 50px;
            gap: 4px; padding: 8px 12px; border-radius: 12px; font-size: 13px;
            align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .history-item:last-child { border-bottom: none; }
        .history-item .h-time { color: #94a3b8; font-size: 12px; }
        .history-item .h-temp { font-weight: 500; color: #fcd34d; }
        .history-item .h-humid { color: #60b0ff; }
        .history-item .h-batt { color: #4ade80; }
        .history-item .h-rssi { color: #94a3b8; font-size: 12px; text-align: right; }
        .history-empty { text-align: center; color: #475569; padding: 28px 0 20px; font-size: 14px; }
        .history-empty .icon { font-size: 28px; margin-bottom: 6px; opacity: 0.4; }

        .log-section {
            background: rgba(0,0,0,0.3); border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05); margin-bottom: 14px; padding: 10px 12px;
        }
        .log-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
        }
        .log-header span { font-size: 13px; color: #94a3b8; font-weight: 500; }
        .log-header .log-clear {
            background: none; border: none; color: #64748b; font-size: 12px;
            cursor: pointer; padding: 2px 8px; border-radius: 6px;
        }
        .log-header .log-clear:hover { background: rgba(255,255,255,0.06); color: #e8edf5; }
        .log-box {
            background: rgba(0,0,0,0.4); border-radius: 10px; padding: 8px 10px;
            max-height: 250px; overflow-y: auto;
            font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6;
            color: #c8d0dc; white-space: pre-wrap; word-break: break-all;
        }
        .log-box::-webkit-scrollbar { width: 3px; }
        .log-box::-webkit-scrollbar-track { background: transparent; }
        .log-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .log-entry { border-bottom: 1px solid rgba(255,255,255,0.03); padding: 2px 0; }
        .log-entry .log-time { color: #64748b; margin-right: 8px; }
        .log-entry .log-msg { color: #e8edf5; }
        .log-entry .log-msg.warn { color: #fbbf24; }
        .log-entry .log-msg.error { color: #f87171; }
        .log-entry .log-msg.success { color: #4ade80; }
        .log-entry .log-msg.debug { color: #a78bfa; }

        .actions {
            display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px;
        }
        .actions .btn {
            flex: 1; min-width: 100px; padding: 14px 16px;
            border: none; border-radius: 16px; font-size: 15px; font-weight: 500;
            cursor: pointer; transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255,255,255,0.06); color: #e8edf5;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .actions .btn:active { transform: scale(0.97); }
        .actions .btn-primary {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-color: transparent; color: #fff;
            box-shadow: 0 4px 16px rgba(37,99,235,0.25);
        }
        .actions .btn-primary.scanning {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 4px 16px rgba(220,38,38,0.25);
        }
        .actions .btn-secondary {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.08);
        }
        .actions .btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(15,23,42,0.95); backdrop-filter: blur(12px);
            padding: 12px 24px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08); color: #e8edf5;
            font-size: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            opacity: 0; transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
            pointer-events: none; z-index: 999; max-width: 90%; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: rgba(248,113,113,0.3); }
        .toast.success { border-color: rgba(74,222,128,0.3); }

        @media (max-width:400px) {
            .main-card .temp-value { font-size: 56px; }
            .main-card .temp-unit { font-size: 22px; }
            .metrics { grid-template-columns: repeat(3,1fr); gap:6px; }
            .metric-item .value { font-size:17px; }
            .history-item { font-size:12px; grid-template-columns:70px 1fr 1fr 1fr 40px; padding:6px 8px; }
            .actions .btn { font-size:13px; padding:12px 12px; min-width:80px; }
            .config-row input { min-width:120px; }
            .log-box { max-height:160px; font-size:11px; }
        }
        @media (min-width:600px) {
            body { padding:30px 20px; }
            .main-card .temp-value { font-size:88px; }
        }
        .hidden { display:none !important; }
    </style>
</head>
<body>
    <div id="app">
        <header class="app-header">
            <span class="app-title">🌡️ BLE 监测</span>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">未连接</span>
                <span style="opacity:0.3;margin:0 2px;">|</span>
                <span>📋 <span class="record-count" id="recordCount">0</span></span>
            </div>
        </header>

        <!-- 配置 -->
        <div class="config-row">
            <label for="uuidInput">目标服务 UUID</label>
            <input type="text" id="uuidInput" value="00000318-0000-1000-8000-00805f9b34fb" spellcheck="false">
            <div class="hint">匹配此服务将解析并显示数据</div>
        </div>
        <div class="config-row">
            <div class="checkbox-wrap">
                <input type="checkbox" id="showAllCheck" checked>
                <label for="showAllCheck">显示所有广播（调试）</label>
            </div>
            <div class="hint">开启后打印每个广播的设备信息及所有服务UUID</div>
        </div>

        <!-- 主卡片 -->
        <section class="main-card">
            <div class="temp-wrap">
                <span class="temp-value" id="tempDisplay">--</span>
                <span class="temp-unit">°C</span>
            </div>
            <div class="temp-label" id="tempLabel">等待数据</div>
            <div class="metrics">
                <div class="metric-item humidity">
                    <div class="label">💧 湿度</div>
                    <div class="value" id="humidDisplay">-- <span class="sub">%</span></div>
                </div>
                <div class="metric-item battery">
                    <div class="label">🔋 电量</div>
                    <div class="value" id="battDisplay">-- <span class="sub">%</span></div>
                </div>
                <div class="metric-item">
                    <div class="label">📶 RSSI</div>
                    <div class="value rssi-val" id="rssiDisplay">-- <span class="sub">dBm</span></div>
                </div>
            </div>
            <div class="no-data" id="noDataMsg">
                <div class="icon">📡</div>
                <div>点击「开始扫描」接收广播</div>
            </div>
        </section>

        <!-- 历史 -->
        <section class="history-section">
            <div class="history-header">
                <h3>📜 历史记录</h3>
                <button class="clear-btn" id="clearHistoryBtn">清空</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty" id="historyEmpty">
                    <div class="icon">📭</div>
                    <div>暂无记录</div>
                </div>
            </div>
        </section>

        <!-- 日志 -->
        <section class="log-section">
            <div class="log-header">
                <span>📋 调试日志</span>
                <button class="log-clear" id="clearLogBtn">清空</button>
            </div>
            <div class="log-box" id="logBox">
                <div class="log-entry"><span class="log-time">[系统]</span><span class="log-msg">就绪，等待扫描...</span></div>
            </div>
        </section>

        <!-- 按钮 -->
        <div class="actions">
            <button class="btn btn-primary" id="scanBtn">
                <span class="icon">▶</span> 开始扫描
            </button>
            <button class="btn btn-secondary" id="exportBtn">
                <span class="icon">📥</span> 导出 CSV
            </button>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ================================================================
        //  全广播调试版 – 默认显示所有广播
        // ================================================================
        let isScanning = false;
        let records = [];
        let db = null;
        let lastData = null;

        const $ = id => document.getElementById(id);
        const statusDot = $('statusDot');
        const statusText = $('statusText');
        const recordCount = $('recordCount');
        const tempDisplay = $('tempDisplay');
        const tempLabel = $('tempLabel');
        const humidDisplay = $('humidDisplay');
        const battDisplay = $('battDisplay');
        const rssiDisplay = $('rssiDisplay');
        const noDataMsg = $('noDataMsg');
        const historyList = $('historyList');
        const historyEmpty = $('historyEmpty');
        const scanBtn = $('scanBtn');
        const exportBtn = $('exportBtn');
        const clearHistoryBtn = $('clearHistoryBtn');
        const toast = $('toast');
        const uuidInput = $('uuidInput');
        const showAllCheck = $('showAllCheck');
        const logBox = $('logBox');
        const clearLogBtn = $('clearLogBtn');

        const DB_NAME = 'db-ble-monitor-db';
        const STORE_NAME = 'store-records';
        const MAX_HISTORY_DISPLAY = 200;

        // ----- 日志 -----
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const cls = type === 'warn' ? 'warn' : type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'debug' ? 'debug' : '';
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="log-msg ${cls}">${msg}</span>`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
            while (logBox.children.length > 400) logBox.removeChild(logBox.firstChild);
            console.log(`[BLE] ${msg}`);
        }
        function clearLog() { logBox.innerHTML = ''; log('日志已清空', 'info'); }

        // ----- IndexedDB -----
        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) {
                        const store = d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('time', 'time', { unique: false });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }
        function saveRecord(db, record) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.add(record);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }
        function loadAllRecords(db) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const index = store.index('time');
                const req = index.openCursor(null, 'prev');
                const result = [];
                req.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) { result.push(cursor.value); cursor.continue(); }
                    else resolve(result);
                };
                req.onerror = () => reject(req.error);
            });
        }
        function clearAllRecords(db) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.clear();
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // ----- 扫描控制 -----
        async function startScan() {
            if (!navigator.bluetooth || !navigator.bluetooth.requestLEScan) {
                log('当前浏览器不支持 BLE 广播扫描', 'error');
                showToast('⚠️ 浏览器不支持 BLE 广播', 'error');
                return false;
            }
            const serviceUuid = uuidInput.value.trim();
            if (!serviceUuid) {
                log('请输入目标服务 UUID', 'warn');
                showToast('⚠️ 请输入目标服务 UUID', 'error');
                return false;
            }
            const uuidRegex = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
            if (!uuidRegex.test(serviceUuid)) {
                log(`UUID 格式错误: ${serviceUuid}`, 'error');
                showToast('⚠️ UUID 格式错误', 'error');
                return false;
            }

            log(`扫描所有广播，目标服务: ${serviceUuid}`, 'info');
            try {
                const scan = await navigator.bluetooth.requestLEScan({
                    acceptAllAdvertisements: true,
                    keepRepeatedDevices: true,
                });
                isScanning = true;
                updateScanUI(true);
                log('✅ 扫描已启动', 'success');
                showToast('✅ 扫描已启动', 'success');
                navigator.bluetooth.addEventListener('advertisementreceived', onAdvertisementReceived);
                return true;
            } catch (err) {
                let msg = '扫描启动失败: ';
                if (err.message?.includes('choosing')) msg += '用户取消';
                else if (err.message?.includes('permission')) msg += '请允许蓝牙权限';
                else msg += err.message || '未知错误';
                log(msg, 'error');
                showToast('⚠️ ' + msg, 'error');
                updateScanUI(false);
                return false;
            }
        }

        function stopScan() {
            if (!isScanning) return;
            try { navigator.bluetooth.stopLEScan(); } catch (e) {}
            navigator.bluetooth.removeEventListener('advertisementreceived', onAdvertisementReceived);
            isScanning = false;
            updateScanUI(false);
            log('扫描已停止', 'info');
            showToast('⏹️ 扫描已停止', '');
        }

        // ----- 广播回调（完整调试打印）-----
        function onAdvertisementReceived(event) {
            const serviceUuid = uuidInput.value.trim();
            const serviceData = event.serviceData;
            const showAll = showAllCheck.checked;

            if (!serviceData) {
                if (showAll) log('⚠️ 广播中没有 serviceData', 'warn');
                return;
            }

            // 收集所有服务 UUID
            const keys = [];
            for (const key of serviceData.keys()) keys.push(key);

            // 获取设备信息
            const deviceName = event.name || '未知设备';
            const deviceAddress = event.address || '未知地址';
            const rssi = event.rssi !== undefined ? event.rssi : -100;

            // 查找匹配服务
            let matchedKey = null;
            let dataView = null;
            for (const key of keys) {
                if (key.toLowerCase() === serviceUuid.toLowerCase()) {
                    matchedKey = key;
                    dataView = serviceData.get(key);
                    break;
                }
            }

            // 如果匹配到，详细打印并解析
            if (dataView) {
                log(`✅ 匹配设备: ${deviceName} (${deviceAddress})`, 'success');
                log(` RSSI: ${rssi} dBm`, 'info');

                if (keys.length > 1) {
                    log(` 其他服务: ${keys.filter(k => k.toLowerCase() !== serviceUuid.toLowerCase()).join(', ')}`, 'debug');
                }

                const bytes = new Uint8Array(dataView.buffer, dataView.byteOffset, dataView.byteLength);
                const hexData = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('');
                log(` Service Data (${matchedKey}): 0x${hexData}`, 'debug');

                if (bytes.length < 6) {
                    log(` 数据长度不足6字节 (${bytes.length})，无法解析`, 'warn');
                    return;
                }

                // 解析温度、湿度、电量
                const sign = bytes[0] === 0 ? 1 : -1;
                const tempInt = bytes[1];
                const tempFrac = bytes[2];
                const temperature = sign * (tempInt + tempFrac / 100.0);

                const humidInt = bytes[3];
                const humidFrac = bytes[4];
                const humidity = humidInt + humidFrac / 100.0;
                const battery = bytes[5];

                log(` 温度: ${temperature.toFixed(2)} °C`, 'success');
                log(` 湿度: ${humidity.toFixed(1)} %`, 'success');
                log(` 电量: ${battery} %`, 'info');
                log('---', 'debug');

                // 更新 UI 并存储
                const record = {
                    time: new Date().toISOString(),
                    timestamp: Date.now(),
                    temperature: Math.round(temperature * 100) / 100,
                    humidity: Math.round(humidity * 100) / 100,
                    battery: Math.min(100, Math.max(0, battery)),
                    rssi: rssi,
                };
                updateMainDisplay(record);
                lastData = record;
                if (db) {
                    saveRecord(db, record).then(() => refreshHistory())
                                          .catch(err => log(`保存失败: ${err.message}`, 'error'));
                } else {
                    records.unshift(record);
                    if (records.length > 1000) records.pop();
                    renderHistory();
                    updateRecordCount();
                }
                return;
            }

            // 未匹配到目标服务，但开启了“显示所有广播”
            if (showAll) {
                log(`📡 广播: ${deviceName} (${deviceAddress})`, 'debug');
                log(` RSSI: ${rssi} dBm`, 'debug');
                if (keys.length === 0) {
                    log(' 无服务数据', 'warn');
                } else {
                    log(` 服务列表: ${keys.join(', ')}`, 'debug');
                    // 打印第一个服务的数据长度作为示例
                    const firstKey = keys[0];
                    const firstData = serviceData.get(firstKey);
                    if (firstData) {
                        const len = firstData.byteLength;
                        const sample = Array.from(new Uint8Array(firstData.buffer, firstData.byteOffset, Math.min(len, 4)))
                                          .map(b => b.toString(16).padStart(2, '0')).join(' ');
                        log(` 示例数据 (${firstKey}) 长度 ${len} 字节: ${sample}...`, 'debug');
                    }
                }
                log('---', 'debug');
            }
        }

        // ----- UI 更新 -----
        function updateScanUI(scanning) {
            if (scanning) {
                statusDot.className = 'status-dot scanning';
                statusText.textContent = '扫描中';
                scanBtn.textContent = '⏹ 停止扫描';
                scanBtn.className = 'btn btn-primary scanning';
                noDataMsg.style.display = 'none';
            } else {
                statusDot.className = 'status-dot';
                statusText.textContent = '已停止';
                scanBtn.textContent = '▶ 开始扫描';
                scanBtn.className = 'btn btn-primary';
                if (!lastData) noDataMsg.style.display = 'block';
            }
        }

        function updateMainDisplay(record) {
            const t = record.temperature;
            const h = record.humidity;
            const b = record.battery;
            const r = record.rssi;
            tempDisplay.textContent = t.toFixed(1);
            tempDisplay.className = 'temp-value';
            if (t < 10) tempDisplay.classList.add('cold');
            else if (t < 28) tempDisplay.classList.add('mild');
            else tempDisplay.classList.add('hot');
            tempLabel.textContent = t < 10 ? '❄️ 凉爽' : t < 28 ? '🌤️ 舒适' : '☀️ 温暖';
            humidDisplay.innerHTML = h.toFixed(1) + ' <span class="sub">%</span>';
            battDisplay.innerHTML = b + ' <span class="sub">%</span>';
            rssiDisplay.innerHTML = r + ' <span class="sub">dBm</span>';
            noDataMsg.style.display = 'none';
        }

        function updateRecordCount() { recordCount.textContent = records.length; }

        // ----- 历史 -----
        function renderHistory() {
            const list = historyList;
            const empty = historyEmpty;
            if (records.length === 0) {
                list.innerHTML = '';
                list.appendChild(empty);
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            const show = records.slice(0, MAX_HISTORY_DISPLAY);
            let html = '';
            for (const r of show) {
                const timeStr = new Date(r.time).toLocaleTimeString('zh-CN', { hour12: false });
                html += `<div class="history-item">
                    <span class="h-time">${timeStr}</span>
                    <span class="h-temp">${r.temperature.toFixed(1)}°C</span>
                    <span class="h-humid">${r.humidity.toFixed(1)}%</span>
                    <span class="h-batt">${r.battery}%</span>
                    <span class="h-rssi">${r.rssi}</span>
                </div>`;
            }
            list.innerHTML = html;
            updateRecordCount();
        }

        async function refreshHistory() {
            if (!db) return;
            try {
                const all = await loadAllRecords(db);
                records = all;
                renderHistory();
            } catch (err) { log(`刷新历史失败: ${err.message}`, 'error'); }
        }

        // ----- 导出 CSV -----
        function exportCSV() {
            if (records.length === 0) {
                showToast('⚠️ 没有数据可导出', 'error');
                return;
            }
            const sorted = [...records].reverse();
            const header = '时间,温度(°C),湿度(%),电量(%),RSSI(dBm)';
            const rows = sorted.map(r => {
                const time = new Date(r.time).toLocaleString('zh-CN', { hour12: false });
                return `${time},${r.temperature.toFixed(1)},${r.humidity.toFixed(1)},${r.battery},${r.rssi}`;
            });
            const csv = [header, ...rows].join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ble_data_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            log(`✅ 导出 ${records.length} 条记录`, 'success');
            showToast(`✅ 导出 ${records.length} 条记录`, 'success');
        }

        // ----- Toast -----
        let toastTimer = null;
        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = 'toast';
            if (type === 'error') toast.classList.add('error');
            if (type === 'success') toast.classList.add('success');
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // ----- 初始化 -----
        async function init() {
            try {
                db = await openDB();
                const all = await loadAllRecords(db);
                records = all;
                renderHistory();
                if (records.length > 0) {
                    const latest = records[0];
                    updateMainDisplay(latest);
                    lastData = latest;
                }
                log(`数据库加载成功，共 ${records.length} 条记录`, 'success');
            } catch (err) {
                log(`数据库初始化失败: ${err.message}，使用内存存储`, 'error');
                showToast('⚠️ 存储初始化失败', 'error');
            }

            scanBtn.addEventListener('click', async () => {
                if (isScanning) { stopScan(); return; }
                await startScan();
            });
            exportBtn.addEventListener('click', exportCSV);
            clearHistoryBtn.addEventListener('click', async () => {
                if (records.length === 0) return showToast('没有历史可清空', '');
                if (!confirm('确定清空所有历史记录？')) return;
                try {
                    if (db) await clearAllRecords(db);
                    records = [];
                    renderHistory();
                    if (!isScanning) {
                        noDataMsg.style.display = 'block';
                        tempDisplay.textContent = '--';
                        tempLabel.textContent = '等待数据';
                        humidDisplay.innerHTML = '-- <span class="sub">%</span>';
                        battDisplay.innerHTML = '-- <span class="sub">%</span>';
                        rssiDisplay.innerHTML = '-- <span class="sub">dBm</span>';
                        lastData = null;
                    }
                    log('🗑️ 已清空所有历史', 'success');
                    showToast('🗑️ 已清空', 'success');
                } catch (err) {
                    log(`清空失败: ${err.message}`, 'error');
                    showToast('清空失败', 'error');
                }
            });
            clearLogBtn.addEventListener('click', clearLog);
            window.addEventListener('beforeunload', () => { if (isScanning) try { navigator.bluetooth.stopLEScan(); } catch(e) {} });

            updateScanUI(false);
            if (records.length === 0) noDataMsg.style.display = 'block';
            log('就绪，等待扫描...', 'info');
            log('💡 提示：「显示所有广播」已默认开启，您将在日志中看到所有附近的BLE设备', 'info');
        }

        document.addEventListener('DOMContentLoaded', init);
        if (document.readyState === 'complete' || document.readyState === 'interactive') init();

        console.log('🌡️ BLE 温湿度监测 – 全广播调试版 (默认显示所有广播)');
    </script>
</body>
</html>
