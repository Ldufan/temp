<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯扫描 BLE 温湿度（无需连接）</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 550px;
            margin: 30px auto;
            padding: 20px;
            background: #f7f9fc;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { font-size: 22px; color: #1a3b5d; text-align: center; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .info-row:last-child { border-bottom: none; }
        .label { color: #5a6c7d; font-weight: 500; }
        .value { font-weight: 600; color: #0b2b44; }
        .value.temp { color: #d35400; }
        .value.humid { color: #2980b9; }
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
        }
        .input-group label { font-weight: 500; color: #1a3b5d; }
        .input-group input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { background: #005bb5; }
        button:disabled { background: #a0b8cc; cursor: not-allowed; }
        .status { text-align: center; color: #5a6c7d; font-size: 14px; margin-top: 12px; }
        .raw {
            word-break: break-all;
            background: #f0f2f5;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            margin-top: 6px;
        }
        .note { font-size: 13px; color: #7f8c8d; margin-top: 12px; text-align: center; }
        .device-name { font-weight: 700; color: #007aff; }
        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>📡 纯扫描 BLE 温湿度</h1>

    <div class="warning">
        ⚠️ 需启用 Chrome 实验性功能：<br>
        <code>chrome://flags/#enable-experimental-web-platform-features</code> → 开启并重启。
    </div>

    <div class="card">
        <div class="info-row">
            <span class="label">📱 设备</span>
            <span class="value device-name" id="deviceName">扫描中…</span>
        </div>
        <div class="info-row">
            <span class="label">状态</span>
            <span class="value" id="statusText">未开始</span>
        </div>
        <div class="info-row">
            <span class="label">🌡️ 温度</span>
            <span class="value temp" id="temperature">-- ℃</span>
        </div>
        <div class="info-row">
            <span class="label">💧 湿度</span>
            <span class="value humid" id="humidity">-- %</span>
        </div>
        <div class="info-row">
            <span class="label">📶 RSSI</span>
            <span class="value" id="rssi">-- dBm</span>
        </div>
        <div class="info-row" style="flex-direction:column; align-items:stretch;">
            <span class="label">📋 Service Data (0x0318)</span>
            <div class="raw" id="rawData">等待数据…</div>
        </div>
    </div>

    <div class="input-group">
        <label for="nameFilter">设备名称包含：</label>
        <input type="text" id="nameFilter" value="RL_HT" placeholder="可选过滤名称" />
    </div>

    <button id="scanBtn">🔍 开始扫描</button>
    <div class="status" id="statusDetail">点击开始扫描广播（无需连接）</div>
    <div class="note">* 只会显示包含 Service Data 0x0318 的设备，温湿度数据自动解析。</div>

    <script>
        (function() {
            const scanBtn = document.getElementById('scanBtn');
            const statusText = document.getElementById('statusText');
            const statusDetail = document.getElementById('statusDetail');
            const deviceNameEl = document.getElementById('deviceName');
            const tempSpan = document.getElementById('temperature');
            const humSpan = document.getElementById('humidity');
            const rssiSpan = document.getElementById('rssi');
            const rawSpan = document.getElementById('rawData');
            const nameFilterInput = document.getElementById('nameFilter');

            let scanController = null;
            let isScanning = false;

            // ---------- 解析函数 ----------
            function parseTemperature(hexString) {
                const clean = hexString.replace(/^0x/, '');
                const padded = clean.length % 2 === 0 ? clean : '0' + clean;
                const bytes = padded.match(/.{1,2}/g).map(b => parseInt(b, 16));
                if (bytes.length < 3) throw new Error('数据长度不足');
                const sign = bytes[0] === 0x00 ? 1 : -1;
                const integer = bytes[1];
                const fraction = bytes[2];
                return sign * (integer + fraction / 100);
            }

            function parseHumidity(hexString) {
                const clean = hexString.replace(/^0x/, '');
                const padded = clean.length % 2 === 0 ? clean : '0' + clean;
                const bytes = padded.match(/.{1,2}/g).map(b => parseInt(b, 16));
                if (bytes.length >= 5) {
                    const intPart = bytes[3];
                    const fracPart = bytes[4];
                    const h = intPart + fracPart / 100;
                    if (h >= 0 && h <= 100) return h;
                }
                return null;
            }

            function updateDisplay(temp, humidity, rssi, rawHex, name) {
                if (name) deviceNameEl.textContent = name;
                tempSpan.textContent = (temp !== null && temp !== undefined) ? temp.toFixed(2) + ' ℃' : '-- ℃';
                humSpan.textContent = (humidity !== null && humidity !== undefined) ? humidity.toFixed(1) + ' %' : '-- %';
                rssiSpan.textContent = (rssi !== null && rssi !== undefined) ? rssi + ' dBm' : '-- dBm';
                rawSpan.textContent = rawHex ? '0x' + rawHex.toUpperCase() : '无数据';
            }

            // ---------- 处理扫描到的广播 ----------
            function handleScanResult(event) {
                const result = event;
                const serviceData = result.serviceData;
                if (!serviceData) return;

                // 查找 UUID 0x0318
                const targetUUID = '00000318-0000-1000-8000-00805f9b34fb';
                let dataView = null;
                for (const [key, value] of serviceData) {
                    if (key === targetUUID || key.includes('0318')) {
                        dataView = value;
                        break;
                    }
                }
                if (!dataView) return; // 忽略不含 0x0318 的设备

                // 可选名称过滤
                const filter = nameFilterInput.value.trim().toLowerCase();
                const deviceName = result.name || '未知';
                if (filter && !deviceName.toLowerCase().includes(filter)) {
                    return; // 名称不匹配，忽略
                }

                // 转十六进制
                const bytes = new Uint8Array(dataView.buffer, dataView.byteOffset, dataView.byteLength);
                let hex = '';
                for (let i = 0; i < bytes.length; i++) {
                    hex += bytes[i].toString(16).padStart(2, '0');
                }

                let temp = null, humid = null;
                try { temp = parseTemperature(hex); } catch (e) { /* 忽略解析错误 */ }
                try { humid = parseHumidity(hex); } catch (e) { /* 忽略 */ }

                const rssi = result.rssi;
                updateDisplay(temp, humid, rssi, hex, deviceName);
                statusText.textContent = '扫描中';
                statusDetail.textContent = '最新数据: ' + new Date().toLocaleTimeString();
            }

            // ---------- 开始/停止扫描 ----------
            async function toggleScan() {
                if (isScanning) {
                    // 停止扫描
                    if (scanController) {
                        scanController.stop();
                        scanController = null;
                    }
                    isScanning = false;
                    scanBtn.textContent = '🔍 开始扫描';
                    statusText.textContent = '已停止';
                    statusDetail.textContent = '扫描已停止';
                    return;
                }

                try {
                    scanBtn.disabled = true;
                    statusDetail.textContent = '正在请求扫描…';

                    // 检查实验性 API
                    if (!navigator.bluetooth || !navigator.bluetooth.requestLEScan) {
                        throw new Error('当前浏览器不支持 requestLEScan，请启用实验性 Web Platform Features 并重启 Chrome。');
                    }

                    // 请求扫描，只扫描包含 Service Data 0x0318 的设备（但名字过滤在回调中做）
                    const options = {
                        // filters: [{ services: ['00000318-0000-1000-8000-00805f9b34fb'] }], // 可选
                        acceptAllAdvertisements: true, // 接收所有广播，我们在回调里过滤
                        keepRepeatedDevices: true      // 持续接收重复广播
                    };

                    scanController = await navigator.bluetooth.requestLEScan(options);
                    scanController.addEventListener('advertisementreceived', handleScanResult);

                    isScanning = true;
                    scanBtn.textContent = '⏹️ 停止扫描';
                    statusText.textContent = '扫描中';
                    statusDetail.textContent = '正在监听广播，等待设备…';
                    deviceNameEl.textContent = '等待设备…';
                    updateDisplay(null, null, null, null, '');

                } catch (error) {
                    console.error(error);
                    statusText.textContent = '错误';
                    statusDetail.textContent = '❌ ' + error.message;
                    if (scanController) {
                        try { scanController.stop(); } catch (e) {}
                        scanController = null;
                    }
                    isScanning = false;
                    scanBtn.textContent = '🔍 开始扫描';
                } finally {
                    scanBtn.disabled = false;
                }
            }

            scanBtn.addEventListener('click', toggleScan);

            // 页面关闭时停止扫描
            window.addEventListener('beforeunload', () => {
                if (scanController) {
                    try { scanController.stop(); } catch (e) {}
                }
            });

            // 初始化
            updateDisplay(null, null, null, null, '未开始');
            if (!navigator.bluetooth) {
                statusText.textContent = '不支持';
                statusDetail.textContent = '⚠️ 此浏览器不支持 Web Bluetooth';
                scanBtn.disabled = true;
            }
        })();
    </script>
</body>
</html>
